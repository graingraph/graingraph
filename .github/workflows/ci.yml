name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  GOFLAGS: "-tags=modernc"
  CGO_ENABLED: "1"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goarch: amd64
            runner: ubuntu-latest
          - os: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            goarch: arm64
            runner: macos-latest
          - os: windows
            goarch: amd64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module
        run: go mod verify

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: Vet
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

      - name: Test
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          # Wall-clock/perf-ratio assertions are skipped here. They are meaningless under
          # the -race detector (instrumentation inflates both sides of any ratio) and the
          # full path enumeration they do is machine-slow; see skipHeavyTiming in
          # cypher/interp. Leave the var unset or "0" locally to run them.
          GRAINGRAPH_SKIP_HEAVY: "1"
        run: go test -count=1 -race -timeout=10m ./...

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...
